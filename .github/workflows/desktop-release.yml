name: CI & Release Kyara Manager Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
    tags:
      - 'desktop-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify & Test Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Type check & tests
        working-directory: desktop
        run: npm run check && npm test

      - name: Build desktop bundle
        working-directory: desktop
        run: npm run build

  package:
    name: Build Installer (${{ matrix.os }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npm run dist:mac
            name: mac
          - os: windows-latest
            cmd: npm run dist:win
            name: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package Desktop Installer
        working-directory: desktop
        run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish Desktop GitHub Releases (Version + Rolling Auto-Update)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true

      - name: Read Desktop version
        id: ver
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish versioned tag release (desktop-vX.Y.Z)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', steps.ver.outputs.version) }}
          name: Kyara Manager Desktop v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true
          files: desktop-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling desktop-latest release for electron-updater
        run: |
          TAG="desktop-latest"
          TARGET=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" desktop-artifacts/* --clobber
          else
            gh release create "$TAG" desktop-artifacts/* --target "$TARGET" --title "Kyara Manager Desktop (Latest)" --notes "Canal de mise à jour automatique pour Kyara Manager Desktop." --latest=false
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
