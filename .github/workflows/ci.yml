name: CI & Package CWS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_cws:
        description: 'Publier directement sur le Chrome Web Store ?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Verify, Test & Package Extension
    runs-on: ubuntu-latest
    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run package:cws

      - name: Upload CWS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyara-manager-cws
          path: dist/kyara-manager-cws.zip
          if-no-files-found: error

      - name: Extract version from package.json or tag
        id: pkg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release with CWS Package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: Kyara Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/kyara-manager-cws.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Auto-Upload & Submit to Chrome Web Store
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_cws)) && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: dist/kyara-manager-cws.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
