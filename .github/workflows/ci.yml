name: CI & Package CWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    name: Verify, Test & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build Chrome Web Store package
        run: npm run package:cws

      - name: Upload CWS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyara-manager-cws
          path: dist/kyara-manager-cws.zip
          if-no-files-found: error

      - name: Extract version from package.json
        id: pkg
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release with CWS Package
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Kyara Manager v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/kyara-manager-cws.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Auto-Upload & Submit to Chrome Web Store
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CHROME_CLIENT_ID != '' && env.CHROME_REFRESH_TOKEN != ''
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: dist/kyara-manager-cws.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
