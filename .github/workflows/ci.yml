name: CI & Package CWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Verify, Test & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run syntax check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run package:cws

      - name: Upload CWS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyara-manager-cws
          path: dist/kyara-manager-cws.zip
          if-no-files-found: error
