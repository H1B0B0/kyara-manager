<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>

  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --bg: #0a090e;
    --bg-card: rgba(21, 20, 26, 0.96);
    --bg-card-raise: #1e1c26;
    --border: #2e2b36;
    --border-light: rgba(255, 255, 255, 0.1);
    --border-focus: #ff4d2e;
    --fg: #edeae4;
    --fg-muted: #9d98a5;
    --fg-dim: #6b6675;
    --acc: #ff4d2e;
    --acc-glow: rgba(255, 77, 46, 0.35);
    --gold: #f5c518;
    --gold-glow: rgba(245, 197, 24, 0.3);
    --emerald: #3fbf7f;
    --cyan: #4dd6ff;
    --purple: #b072ff;
    --rarity-m: #ff4d2e;
    --rarity-l: #f5c518;
    --rarity-e: #b072ff;
    --rarity-r: #4d9bff;
    --rarity-u: #3fbf7f;
    --rarity-c: #b5b1bb;
    --font-title: 'Unbounded', system-ui, sans-serif;
    --font-body: 'Zen Kaku Gothic New', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      radial-gradient(rgba(255, 77, 46, 0.04) 1px, transparent 1px);
    background-size: 24px 24px, 48px 48px;
    background-position: 0 0, 12px 12px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }

body {
  width: 440px;
  height: 280px;
  position: relative;
  background: radial-gradient(circle at 50% 35%, #1d182a 0%, #0c0b11 65%, #060508 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 24px 20px 20px 20px;
  text-align: center;
}

.top-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 77, 46, 0.12);
  border: 1px solid rgba(255, 77, 46, 0.35);
  border-radius: 999px;
  padding: 4px 12px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--acc);
  letter-spacing: 0.5px;
}

.center-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: -2px;
}

.logo-seal {
  width: 62px;
  height: 62px;
  border-radius: 16px;
  background: linear-gradient(135deg, #282236, #14131a);
  border: 2px solid var(--acc);
  box-shadow: 0 0 28px var(--acc-glow), inset 0 0 14px rgba(255, 77, 46, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-title);
  font-size: 30px;
  font-weight: 900;
  color: var(--acc);
}

.brand-title {
  font-family: var(--font-title);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #fff;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
}

.brand-subtitle {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--gold);
}

.pills-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pill {
  background: rgba(30, 28, 38, 0.85);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 4px;
}

.footer-bar {
  font-size: 10px;
  color: var(--fg-dim);
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-orb" style="top: 20px; left: 120px; width: 200px; height: 200px; background: rgba(255, 77, 46, 0.2);"></div>

  <div class="top-tag">
    <span>★ EXTENSION CHROME · MANIFEST V3</span>
  </div>

  <div class="center-box">
    <div class="logo-seal">操</div>
    <h1 class="brand-title">KYARA MANAGER</h1>
    <div class="brand-subtitle">Pilote Automatique & Arbitrage</div>
  </div>

  <div>
    <div class="pills-row">
      <div class="pill"><span style="color:var(--gold)">売</span> Auto-Vente</div>
      <div class="pill"><span style="color:var(--emerald)">転</span> Recyclage</div>
      <div class="pill"><span style="color:var(--cyan)">市</span> Flips Marché</div>
      <div class="pill"><span style="color:var(--acc)">札</span> Boosters</div>
    </div>
  </div>

  <div class="footer-bar">
    POUR KYARA.GAMES · 100% LOCAL & SÉCURISÉ
  </div>
</body>
</html>
