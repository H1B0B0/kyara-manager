<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@700&family=Unbounded:wght@800;900&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px;
    height: 280px;
    background: #09080c;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #edeae4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 22px 20px 18px 20px;
    text-align: center;
    position: relative;
  }

  .backdrop-ai-small {
    position: absolute;
    inset: 0;
    background-image: url('file:///Users/etiennementrel/.gemini/antigravity/brain/b940700c-9447-4038-95e4-aaf2f3023806/kyara_manager_promo_banner_1793817710243.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.28;
    filter: blur(2px);
    z-index: 1;
  }

  .top-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 77, 46, 0.15);
    border: 1px solid rgba(255, 77, 46, 0.4);
    border-radius: 999px;
    padding: 4px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: #ff4d2e;
    position: relative;
    z-index: 2;
  }

  .center-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 2;
  }

  .brand-logo-small {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    box-shadow: 0 0 28px rgba(255, 77, 46, 0.45);
  }

  .brand-heading {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .brand-tag {
    font-size: 12.5px;
    font-weight: 700;
    color: #f5c518;
  }

  .features-strip {
    display: flex;
    gap: 6px;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .strip-pill {
    background: rgba(21, 20, 26, 0.9);
    border: 1px solid #2e2b36;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 10.5px;
    font-weight: 600;
    color: #edeae4;
  }

  .footer-text {
    font-size: 10px;
    color: #8e8a98;
    font-family: 'JetBrains Mono', monospace;
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="backdrop-ai-small"></div>

  <div class="top-pill">★ EXTENSION CHROME · MANIFEST V3</div>

  <div class="center-box">
    <img src="file:///Users/etiennementrel/Documents/perso/kyara-manager/icons/icon-128.png" class="brand-logo-small" alt="Kyara Manager" />
    <div class="brand-heading">KYARA MANAGER</div>
    <div class="brand-tag">Pilote Automatique &amp; Arbitrage</div>
  </div>

  <div class="features-strip">
    <div class="strip-pill"><span style="color:#f5c518">💰</span> Auto-Vente</div>
    <div class="strip-pill"><span style="color:#3fbf7f">♻️</span> Recyclage</div>
    <div class="strip-pill"><span style="color:#4dd6ff">🎯</span> Flips</div>
    <div class="strip-pill"><span style="color:#ff4d2e">📦</span> Boosters</div>
  </div>

  <div class="footer-text">
    POUR KYARA.GAMES · 100% LOCAL &amp; SÉCURISÉ
  </div>
</body>
</html>
