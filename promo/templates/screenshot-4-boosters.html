<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Unbounded:wght@800;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 800px;
    background: #09080c;
    overflow: hidden;
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    color: #edeae4;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .ambient-glow {
    position: absolute;
    top: -120px;
    left: 200px;
    width: 600px;
    height: 350px;
    background: radial-gradient(ellipse, rgba(255, 77, 46, 0.16) 0%, rgba(245, 197, 24, 0.08) 50%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  .header-bar {
    height: 88px;
    background: linear-gradient(180deg, #171520 0%, #0e0d13 100%);
    border-bottom: 1px solid #282534;
    padding: 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .badge-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #ff4d2e;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }

  .title-text {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .subtitle-text {
    font-size: 12.5px;
    color: #9d98a5;
  }

  .brand-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 28, 38, 0.85);
    border: 1px solid #2e2b36;
    border-radius: 12px;
    padding: 8px 14px;
  }

  .seal-box {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #ff4d2e;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Screenshot Container */
  .screen-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 28px 22px 28px;
    position: relative;
    z-index: 2;
  }

  .screen-frame {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #2e2b36;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 77, 46, 0.12);
    display: flex;
    background: #0e0d12;
  }

  .screen-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
</style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="header-bar">
    <div>
      <div class="badge-tag">
        <span style="width:6px; height:6px; border-radius:50%; background:#ff4d2e;"></span>
        <span>04 / ESPÉRANCE CHAKRA (EV) & PILOTAGE LIVE</span>
      </div>
      <div class="title-text">Rentabilité des Boosters & Tirage Live Piloté</div>
      <div class="subtitle-text">Classement probabiliste des packs selon l'EV, suivi de la Pitié Mythique et ouverture animée</div>
    </div>
    <div class="brand-pill">
      <div class="seal-box">操</div>
      <div>
        <div style="font-family:'Unbounded'; font-size:13px; font-weight:900; color:#fff;">KYARA MANAGER</div>
        <div style="font-size:10.5px; color:#3fbf7f; font-weight:700;">● Pilote Connecté (v1.1)</div>
      </div>
    </div>
  </div>

  <div class="screen-container">
    <div class="screen-frame">
      <img class="screen-img" src="file:///Users/etiennementrel/Documents/perso/kyara-manager/promo/raw/screen-4-boosters.png" />
    </div>
  </div>
</body>
</html>
