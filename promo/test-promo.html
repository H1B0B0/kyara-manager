<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Unbounded:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px;
    height: 280px;
    background: #0e0d12;
    overflow: hidden;
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    color: #edeae4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,77,46,0.22) 0%, rgba(245,197,24,0.08) 40%, transparent 70%);
    pointer-events: none;
  }
  .logo-box {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #181620;
    border: 2px solid #ff4d2e;
    box-shadow: 0 0 24px rgba(255,77,46,0.4), inset 0 0 12px rgba(255,77,46,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #ff4d2e;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    margin-bottom: 6px;
  }
  p {
    font-size: 12px;
    color: #b7b2bd;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo-box">操</div>
  <h1>KYARA MANAGER</h1>
  <p>Pilote Automatique pour Kyara.games</p>
</body>
</html>
